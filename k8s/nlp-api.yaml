# Rendered by ansible/deploy.yml (Jinja fills in {{ image }}), then applied with kubernetes.core.k8s
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-api
  labels: { app: nlp-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nlp-api }
  template:
    metadata:
      labels: { app: nlp-api }
    spec:
      containers:
        - name: nlp-api
          image: "{{ image }}"
          imagePullPolicy: Never # Jenkins loads the image straight into k3s, no registry
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-api
spec:
  type: NodePort
  selector: { app: nlp-api }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
