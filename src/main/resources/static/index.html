<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-Time NLP API</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1f2937; background: #f8fafc; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: #6b7280; margin-top: 0; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; padding: 10px; font: inherit; border: 1px solid #cbd5e1; border-radius: 8px; }
  button { margin-top: 10px; padding: 10px 22px; font: inherit; color: #fff; background: #4f46e5; border: 0; border-radius: 8px; cursor: pointer; }
  .card { margin-top: 20px; padding: 16px 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; }
  .label { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; text-transform: capitalize; }
  .positive { background: #dcfce7; color: #166534; } .negative { background: #fee2e2; color: #991b1b; } .neutral { background: #e5e7eb; color: #374151; }
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; margin: 14px 0 0; }
  dt { color: #6b7280; } dd { margin: 0; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
<h1>Real-Time NLP API</h1>
<p class="sub">Sentiment, keywords and counts for any text &middot; POST /api/analyze</p>
<textarea id="text">I love this project. It is fast and reliable.</textarea>
<button id="go">Analyze</button>
<div id="out"></div>
<script>
  const out = document.getElementById('out');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  document.getElementById('go').onclick = async () => {
    const res = await fetch('/api/analyze', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: document.getElementById('text').value})});
    if (!res.ok) { out.innerHTML = `<div class="card error">Error ${res.status}: text must be 1-10,000 characters</div>`; return; }
    const r = await res.json();
    out.innerHTML = `<div class="card"><span class="label ${esc(r.sentiment)}">${esc(r.sentiment)}</span>
      <dl><dt>Score</dt><dd>${r.score}</dd><dt>Keywords</dt><dd>${r.keywords.map(esc).join(', ') || '-'}</dd>
      <dt>Sentences</dt><dd>${r.sentences}</dd><dt>Tokens</dt><dd>${r.tokens}</dd>
      <dt>Processing time</dt><dd>${r.micros} &micro;s</dd></dl></div>`;
  };
</script>
</body>
</html>
