[defaults]
# Inventory plugin: hosts come from AWS by tag, no hard-coded IPs
inventory = inventory/aws_ec2.yml
remote_user = ubuntu
private_key_file = ~/.ssh/nlp-api.pem
# Fresh EC2 hosts have new SSH host keys every launch
host_key_checking = False
# Callback plugin: per-task timings on every run
callbacks_enabled = ansible.posix.profile_tasks
